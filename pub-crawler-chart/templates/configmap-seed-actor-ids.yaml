{{- if and .Values.recoverHttpStatus.enabled .Values.recoverHttpStatus.seedCsv }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pub-crawler.fullname" . }}-seed-actor-ids
  labels:
    {{- include "pub-crawler.labels" . | nindent 4 }}
  annotations:
    # Early hook so the recover-http-status Job (weight -1) can mount it.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  webfinger-to-actor-id.csv: |-
{{ .Values.recoverHttpStatus.seedCsv | indent 4 }}
{{- end }}

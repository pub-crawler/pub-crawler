{{- if .Values.recoverFailed.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pub-crawler.fullname" . }}-recover-failed
  labels:
    {{- include "pub-crawler.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    # After prioritiseQueue (-4), last before the crawler starts, so the new
    # crawler drains what recovery re-enqueues.
    "helm.sh/hook-weight": "-3"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "pub-crawler.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: recover-failed
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: recover-failed
          image: {{ include "pub-crawler.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "bin/recover_failed.py"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # The config map supplies PRIVATE_KEY_PEM (path to the mounted key):
          # recovery never signs a request, but make_dispatcher's clients parse
          # the key at construction, so it must be present and valid.
          envFrom:
            - configMapRef:
                name: {{ include "pub-crawler.fullname" . }}-config
          env:
            {{- include "pub-crawler.dbEnv" . | nindent 12 }}
            {{- include "pub-crawler.redisEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "pub-crawler.keyVolumeMount" . | nindent 12 }}
          {{- with .Values.recoverFailed.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- include "pub-crawler.keyVolume" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

{{- if .Values.recoverHttpStatus.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pub-crawler.fullname" . }}-recover-http-status
  labels:
    {{- include "pub-crawler.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    # Last hook before the crawler; safe concurrent with a running crawl, so
    # the usual run is render + kubectl apply rather than a helm upgrade.
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "pub-crawler.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: recover-http-status
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: recover-http-status
          image: {{ include "pub-crawler.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "bin/recover_http_status.py"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # Config map supplies PRIVATE_KEY_PEM (make_dispatcher parses the key
          # eagerly); SEED_FILE points at the mounted webfinger->actor-id CSV.
          envFrom:
            - configMapRef:
                name: {{ include "pub-crawler.fullname" . }}-config
          env:
            {{- include "pub-crawler.dbEnv" . | nindent 12 }}
            {{- include "pub-crawler.redisEnv" . | nindent 12 }}
            - name: SEED_FILE
              value: /etc/pub-crawler-seeds/webfinger-to-actor-id.csv
          volumeMounts:
            {{- include "pub-crawler.keyVolumeMount" . | nindent 12 }}
            - name: seed-actor-ids
              mountPath: /etc/pub-crawler-seeds
              readOnly: true
          {{- with .Values.recoverHttpStatus.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- include "pub-crawler.keyVolume" . | nindent 8 }}
        - name: seed-actor-ids
          configMap:
            name: {{ include "pub-crawler.fullname" . }}-seed-actor-ids
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pub-crawler.fullname" . }}
  labels:
    {{- include "pub-crawler.labels" . | nindent 4 }}
  annotations:
    # Created as an early hook (weight -20) so the migrate/seed pre-install
    # hooks can reference it; before-hook-creation (no hook-succeeded) keeps it
    # alive for the normal-phase crawler Job and snapshot CronJob.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  DATABASE_URL: {{ required "database.url is required (postgresql://...)" .Values.database.url | quote }}
  REDIS_URL: {{ required "redis.url is required (redis://...)" .Values.redis.url | quote }}
  {{- if not .Values.privateKey.pem }}
  {{- fail "privateKey.pem is required — supply it, e.g. --set-file privateKey.pem=private.pem" }}
  {{- end }}
  private.pem: |-
{{ .Values.privateKey.pem | indent 4 }}

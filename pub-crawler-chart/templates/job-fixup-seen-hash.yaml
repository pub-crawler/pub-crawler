{{- if .Values.fixupSeenHash.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pub-crawler.fullname" . }}-fixup-seen-hash
  labels:
    {{- include "pub-crawler.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    # Rewrites the SEEN oracle from full job-id strings (pub_crawler:seen) into
    # blake2b-64 hashes (pub_crawler:seen_hashed) the hashed dispatcher reads.
    # Same tier as fixup-crc-tiebreak / fixup-zero-score (-2); order among them
    # doesn't matter -- they touch queue members/scores, this touches the SEEN
    # set. Last step before the crawler starts.
    "helm.sh/hook-weight": "-2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "pub-crawler.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: fixup-seen-hash
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: fixup-seen-hash
          image: {{ include "pub-crawler.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "fixup/fixup_seen_hash.py"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "pub-crawler.redisEnv" . | nindent 12 }}
          {{- with .Values.fixupSeenHash.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
